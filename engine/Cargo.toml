[package]
name = "palamedes"
version = "0.1.0"
edition = "2024"
description = "Backgammon engine: rules, move generation, features (WASM-ready)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
